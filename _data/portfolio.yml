# =========================================================
# 2. 연구 분야 (Research)
# =========================================================
# diagram: assets/images/research/ 안의 svg 파일 경로입니다. 비워두면 다이어그램 없이 글만 표시됩니다.
researches:
  - title: "복잡도 관리 및 시스템 설계 (Complexity Management and System Design)"
    icon: "fa-diagram-project" # FontAwesome 아이콘 이름
    description: "제품을 하나의 '시스템'으로 보고, 개발 초기 단계에서 발생하는 복잡성을 정량화하고 관리하는 방법론을 연구합니다. 생애주기 전반(생산·사용·서비스·재활용)에서 도출한 기준으로 부품을 체계적으로 모듈화해, 다양한 고객 요구는 만족시키면서도 복잡성과 비용은 낮추는 제품 아키텍처를 설계합니다."
    diagram: "/assets/images/research/diagram-1-architecture.svg"

  - title: "시스템 레벨 설계-제조 자율화 (Design-Manufacturing Automation in System Level)"
    icon: "fa-robot"
    description: "공학설계 (Engineering Design) 기반 창의적 제품개발을 체계적으로 수행하는 설계 방법론에 대해 연구합니다. 첨단제조공정을 고려하여 설계를 지원하는 AI 기반 설계/제조 자동화 (예, Design for Additive Manufacturing, Sustainable Manufacturing)와 같은 시스템 레벨의 설계 판단을 AI로 자동화(AX)하는 데 집중합니다. 궁극적으로는 사람의 개입을 최소화한 자율제조(Autonomous Manufacturing)를 지향합니다."
    diagram: "/assets/images/research/diagram-2-automation.svg"

  - title: "지능형 설계 및 생산 (Intelligent Design and Manufacturing)"
    icon: "fa-brain"
    description: "전문가 암묵지를 정형화하여 Knowlege Base (지식 베이스)를 설계하고 개발합니다. 제품설계 데이터와 생산공정을 포함한 제품생산주기의 비정형 데이터를 정형화하여 메타정보를 추출하여 전문가 정보를 저장, 검색, 추출 등을 지원합니다.  Knowlege Base 은 AI의 두뇌에 해당하고, 의미기반 검색을 지원하고, 설계 및 생산의 디지털 트윈을 개발합니다."
    diagram: "/assets/images/research/diagram-3-knowledge.svg"

